<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UpskillTech Course</title>
<!-- Real title is set from COURSE_TITLE at boot, below. Don't hand-edit this tag. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=General+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════════════════
   UPSKILLTECH DESIGN TOKENS
═══════════════════════════════════════════ */
:root {
  /* Backgrounds */
  --bg:       #070C16;
  --bg-e:     #0E1726;
  --bg-s:     #0B1220;
  --bg-hover: #131D30;

  /* Rules / borders */
  --rule:     #1B2638;
  --rule-s:   #283449;

  /* Text */
  --text:       #E8EDF5;
  --text-soft:  #A3AEC2;
  --text-quiet: #64748B;
  --text-faint: #475569;

  /* Brand palette */
  --brand-sky:    #2BA9DC;
  --brand-teal:   #0F5F8A;
  --brand-bright: #4FC0F0;
  --brand-ink:    #0A1628;
  --brand-gold:   #FFC532;
  --brand-gold-soft: rgba(255,197,50,.10);
  --brand-sky-soft:  rgba(43,169,220,.10);
  --brand-sky-line:  rgba(43,169,220,.20);

  /* Semantic status */
  --green:      #2DD4BF;
  --green-soft: rgba(45,212,191,.10);
  --yellow:     #FFC532;
  --yellow-soft: rgba(255,197,50,.10);
  --red:        #F87171;
  --red-soft:   rgba(248,113,113,.10);

  /* Typography */
  --sans: 'General Sans', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', monospace;
  --serif: 'Instrument Serif', Georgia, serif;

  /* Shape */
  --radius:    10px;
  --radius-sm: 6px;
  --max:       860px;
}

/* ═══════════════════════════════════════════
   RESET
═══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* Grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,.028) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

/* ═══════════════════════════════════════════
   TYPOGRAPHY
═══════════════════════════════════════════ */
h1, h2, h3, h4 {
  font-family: var(--serif);
  font-weight: 400;
  color: var(--text);
}
h1 { font-size: 34px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.01em; }
h2 { font-size: 24px; line-height: 1.25; margin: 36px 0 14px; letter-spacing: -0.01em; }
h3 { font-size: 18px; line-height: 1.3; margin: 28px 0 10px; }
h4 { font-size: 15px; line-height: 1.35; margin: 22px 0 8px; font-family: var(--sans); font-weight: 600; }
p { margin: 0 0 16px; color: var(--text-soft); }
a { color: var(--brand-sky); text-decoration: none; }
a:hover { color: var(--brand-bright); text-decoration: underline; }
ul, ol { margin: 0 0 16px; padding-left: 22px; }
ul li, ol li { margin-bottom: 6px; color: var(--text-soft); }
strong { color: var(--text); font-weight: 600; }
em { font-style: italic; }

code {
  font-family: var(--mono);
  font-size: 0.85em;
  background: var(--bg-e);
  border: 1px solid var(--rule);
  padding: 1px 7px;
  border-radius: 4px;
  color: var(--brand-bright);
}
pre {
  background: var(--bg-e);
  border: 1px solid var(--rule);
  padding: 18px 20px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  font-size: 13px;
  line-height: 1.6;
  margin: 0 0 14px;
}
pre code {
  background: transparent;
  border: none;
  padding: 0;
  color: var(--brand-bright);
}

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ═══════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════ */
.sidebar {
  background: var(--bg-s);
  border-right: 1px solid var(--rule);
  padding: 24px 18px;
  overflow-y: auto;
  position: sticky;
  top: 0;
  height: 100vh;
}

/* Brand mark */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--rule);
}
.brand-logo {
  width: 30px;
  height: 30px;
  background: linear-gradient(135deg, var(--brand-teal) 0%, var(--brand-sky) 55%, var(--brand-bright) 100%);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 16px rgba(43,169,220,.25);
}
.brand-logo svg { width: 16px; height: 16px; fill: #fff; }
.brand-name {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-quiet);
  text-transform: uppercase;
  letter-spacing: .14em;
}

/* Course title */
.course-title {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.3;
  color: var(--text);
  margin-bottom: 4px;
}
.course-overview {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--brand-sky);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: .1em;
  margin-bottom: 18px;
  display: inline-block;
}
.course-overview:hover { color: var(--brand-bright); }

/* Progress bar */
.course-progress { margin-bottom: 20px; }
.course-progress .pct {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 6px;
}
.course-progress .bar {
  height: 3px;
  background: var(--rule-s);
  border-radius: 99px;
  overflow: hidden;
}
.course-progress .bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--brand-teal), var(--brand-sky));
  transition: width 300ms ease;
}

/* Sidebar nav */
.section-title {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .14em;
  margin: 16px 0 6px 8px;
}

.lesson-link {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-quiet);
  cursor: pointer;
  transition: background 100ms, color 100ms;
  line-height: 1.35;
}
.lesson-link:hover { background: var(--bg-hover); color: var(--text-soft); }
.lesson-link.active {
  background: var(--brand-sky-soft);
  color: var(--brand-bright);
  border: 1px solid var(--brand-sky-line);
}
.lesson-link .dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid var(--rule-s);
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 150ms;
}
.lesson-link.completed .dot {
  background: var(--brand-teal);
  border-color: var(--brand-teal);
  position: relative;
}
.lesson-link.completed .dot::after {
  content: "✓";
  color: white;
  font-size: 8px;
  font-weight: 700;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.lesson-link.active .dot { border-color: var(--brand-sky); }

/* ═══════════════════════════════════════════
   MAIN CONTENT
═══════════════════════════════════════════ */
.content {
  padding: 60px 52px 80px;
  max-width: 100%;
  overflow-x: hidden;
}
.content-inner { max-width: var(--max); margin: 0 auto; }

/* Lesson header */
.lesson-header {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 20px;
  margin-bottom: 28px;
}
.breadcrumb {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .1em;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.breadcrumb::before {
  content: '';
  width: 14px;
  height: 1px;
  background: var(--brand-teal);
}
.estimated-time {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-e);
  border: 1px solid var(--rule);
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-quiet);
  margin: 10px 0;
}
.estimated-time strong { color: var(--text-soft); font-weight: 500; }

/* ═══════════════════════════════════════════
   OBJECTIVES BLOCK
═══════════════════════════════════════════ */
.objectives {
  background: var(--bg-e);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--brand-sky);
  padding: 20px 24px;
  border-radius: var(--radius-sm);
  margin: 18px 0 28px;
}
.objectives h3 {
  margin: 0 0 6px;
  font-size: 14px;
  font-family: var(--sans);
  font-weight: 700;
  color: var(--brand-bright);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.objectives p { margin: 0 0 10px; font-size: 14px; }
.objectives ul { margin: 0; padding-left: 20px; }
.objectives ul li { color: var(--text-soft); font-size: 14px; }

/* ═══════════════════════════════════════════
   VIDEO
═══════════════════════════════════════════ */
.video-card {
  display: block;
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
  border-radius: var(--radius);
  overflow: hidden;
  background: #000;
  margin: 18px 0 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,.4), 0 0 0 1px var(--rule);
  text-decoration: none;
  cursor: pointer;
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.video-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 0 1px var(--brand-sky-line);
}
.video-card .thumb {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-color: var(--bg-e);
}
.video-card .thumb::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 60%;
  background: linear-gradient(to top, rgba(7,12,22,.9) 0%, rgba(7,12,22,0) 100%);
}
.video-card .play {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 72px; height: 72px;
  background: rgba(7,12,22,.7);
  border: 2px solid rgba(79,192,240,.4);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 160ms, border-color 160ms, transform 160ms;
  z-index: 3;
}
.video-card:hover .play {
  background: rgba(43,169,220,.25);
  border-color: var(--brand-sky);
  transform: translate(-50%, -50%) scale(1.06);
}
.video-card .play::before {
  content: "";
  width: 0; height: 0;
  border-style: solid;
  border-width: 13px 0 13px 22px;
  border-color: transparent transparent transparent var(--brand-bright);
  margin-left: 4px;
}
.video-card .meta {
  position: absolute;
  left: 18px; right: 18px; bottom: 14px;
  color: white;
  z-index: 2;
}
.video-card .vtitle { font-size: 15px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
.video-card .vsub { font-size: 12px; opacity: 0.7; font-family: var(--mono); }
.video-card .badge {
  position: absolute; top: 12px; right: 12px;
  background: var(--brand-teal);
  color: white;
  font-family: var(--mono);
  font-size: 10px; font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 4px;
  z-index: 4;
}

.video-frame {
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
  border-radius: var(--radius);
  overflow: hidden;
  background: #000;
  margin: 18px 0 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,.4), 0 0 0 1px var(--rule);
}
.video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-meta-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; margin: 0 2px 4px; font-size: 12.5px;
}
.video-meta-text { color: var(--text-quiet); font-family: var(--mono); font-size: 11px; }
.video-meta-text strong { color: var(--text-soft); font-weight: 500; font-family: var(--sans); font-size: 13px; }
.video-meta-link { color: var(--brand-sky); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
.video-caption { font-size: 13px; color: var(--text-faint); margin: 4px 0 26px; font-style: italic; }

/* ═══════════════════════════════════════════
   KEY TAKEAWAYS
═══════════════════════════════════════════ */
.takeaways {
  background: var(--brand-sky-soft);
  border: 1px solid var(--brand-sky-line);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin: 24px 0;
}
.takeaways h4 {
  margin: 0 0 12px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .16em;
  color: var(--brand-sky);
}
.takeaways ul { margin: 0; padding-left: 20px; }
.takeaways li { color: var(--text-soft); font-size: 14px; margin-bottom: 8px; }

/* ═══════════════════════════════════════════
   CALLOUTS
═══════════════════════════════════════════ */
.callout {
  background: var(--bg-e);
  border: 1px solid var(--rule);
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  margin: 18px 0;
  font-size: 14px;
}
.callout.note  { border-left: 3px solid var(--brand-sky); background: var(--brand-sky-soft); }
.callout.warn  { border-left: 3px solid var(--yellow); background: var(--yellow-soft); }
.callout.danger { border-left: 3px solid var(--red); background: var(--red-soft); }
.callout.tip   { border-left: 3px solid var(--green); background: var(--green-soft); }
.callout-label {
  display: inline-block;
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-right: 8px;
  color: var(--text-quiet);
}

/* ═══════════════════════════════════════════
   COMPARE GRID
═══════════════════════════════════════════ */
.compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin: 24px 0;
}
.compare-card {
  background: var(--bg-e);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  flex-direction: column;
  transition: border-color 150ms;
}
.compare-card:hover { border-color: var(--rule-s); }
.compare-card.featured {
  border-color: var(--brand-sky);
  box-shadow: 0 0 0 1px var(--brand-sky-line), 0 4px 20px rgba(43,169,220,.08);
}
.compare-card .tag {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--brand-sky);
  margin-bottom: 8px;
}
.compare-card.featured .tag { color: var(--brand-bright); }
.compare-card h4 { margin: 0 0 6px; font-size: 16px; font-family: var(--serif); color: var(--text); }
.compare-card .sub { font-size: 13px; color: var(--text-quiet); margin-bottom: 12px; }
.compare-card .best-for {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-faint);
  margin: 6px 0;
}
.compare-card ul { padding-left: 16px; font-size: 13px; margin: 0; }
.compare-card ul li { color: var(--text-quiet); margin-bottom: 5px; }

/* ═══════════════════════════════════════════
   PROMPT CARD
═══════════════════════════════════════════ */
.prompt-card {
  background: var(--bg-e);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin: 20px 0;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-soft);
}
.prompt-card .prompt-label {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-faint);
  margin-bottom: 12px;
}
.prompt-card .annot {
  background: var(--brand-sky-soft);
  padding: 1px 5px;
  border-bottom: 1.5px dashed var(--brand-sky);
  cursor: help;
  border-radius: 3px;
  color: var(--brand-bright);
}
.prompt-card .legend {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--text-faint);
  margin-top: 14px;
  border-top: 1px dashed var(--rule);
  padding-top: 10px;
}

/* ═══════════════════════════════════════════
   QUIZ
═══════════════════════════════════════════ */
.quiz {
  background: var(--bg-e);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin: 28px 0;
}
.quiz h4 {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: var(--brand-sky);
  margin: 0 0 10px;
}
.quiz .q-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 14px; }
.quiz .options { display: flex; flex-direction: column; gap: 8px; }
.quiz .option {
  border: 1px solid var(--rule);
  background: var(--bg);
  padding: 11px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  text-align: left;
  color: var(--text-soft);
  transition: all 100ms;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--sans);
}
.quiz .option:hover { border-color: var(--brand-sky); background: var(--brand-sky-soft); color: var(--text); }
.quiz .option.correct {
  border-color: var(--green);
  background: var(--green-soft);
  color: var(--green);
  font-weight: 600;
}
.quiz .option.incorrect {
  border-color: var(--red);
  background: var(--red-soft);
  color: var(--red);
}
.quiz .option .icon { font-size: 15px; }
.quiz .feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  display: none;
}
.quiz .feedback.correct {
  background: var(--green-soft);
  border: 1px solid rgba(45,212,191,.2);
  color: var(--green);
  display: block;
}
.quiz .feedback.incorrect {
  background: var(--red-soft);
  border: 1px solid rgba(248,113,113,.2);
  color: var(--red);
  display: block;
}

/* Final quiz */
.final-quiz .q-counter {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-faint);
  margin-bottom: 6px;
}
.final-quiz .next-btn {
  margin-top: 16px;
  background: var(--brand-gold);
  color: #070C16;
  border: 0;
  padding: 10px 24px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 14px;
  font-family: var(--sans);
  cursor: pointer;
  transition: opacity 120ms;
}
.final-quiz .next-btn:disabled { background: var(--rule-s); color: var(--text-faint); cursor: not-allowed; }
.final-quiz .results { text-align: center; padding: 30px 0; }
.final-quiz .score {
  font-size: 56px;
  font-weight: 700;
  color: var(--brand-bright);
  font-family: var(--serif);
}

/* ═══════════════════════════════════════════
   TABS
═══════════════════════════════════════════ */
.tabs {
  background: var(--bg-e);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  margin: 24px 0;
  overflow: hidden;
}
.tabs .tab-header {
  display: flex;
  border-bottom: 1px solid var(--rule);
  background: var(--bg-s);
}
.tabs .tab-btn {
  flex: 1;
  padding: 11px 16px;
  background: transparent;
  border: 0;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-faint);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  text-align: center;
  transition: all 100ms;
}
.tabs .tab-btn:hover { color: var(--text-soft); }
.tabs .tab-btn.active {
  color: var(--brand-bright);
  border-bottom-color: var(--brand-sky);
  background: var(--bg-e);
}
.tabs .tab-content { padding: 20px; display: none; font-size: 14px; }
.tabs .tab-content.active { display: block; }
.tabs .file-tree {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-quiet);
  background: var(--bg);
  border: 1px solid var(--rule);
  padding: 14px;

function attachQuizHandlers() {
  document.querySelectorAll('.quiz[data-quiz-idx]').forEach(box => {
    const data = INLINE_QUIZZES[parseInt(box.getAttribute('data-quiz-idx'))];
    let html = `<h4>Knowledge check</h4><div class="q-title">${data.q}</div><div class="options">`;
    data.options.forEach(opt => {
      html += `<button class="option" data-correct="${opt.correct}" data-why="${opt.why?opt.why.replace(/"/g,'&quot;'):''}"><span class="icon">○</span><span>${opt.text}</span></button>`;
    });
    html += `</div><div class="feedback"></div>`;
    box.innerHTML = html;
    box.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => {
        const correct = btn.getAttribute('data-correct') === 'true';
        const why = btn.getAttribute('data-why');
        box.querySelectorAll('.option').forEach(b => {
          b.disabled = true;
          if (b.getAttribute('data-correct') === 'true') b.classList.add('correct');
        });
        if (!correct) btn.classList.add('incorrect');
        const fb = box.querySelector('.feedback');
        fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
        fb.innerHTML = (correct ? '<strong>Correct.</strong> ' : '<strong>Not quite.</strong> ') + why;
      });
    });
  });
}

    const btns = tabBox.querySelectorAll('.tab-btn');
    const contents = tabBox.querySelectorAll('.tab-content');
    btns.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        btns.forEach(b => b.classList.remove('active'));
        contents.forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        contents[idx].classList.add('active');
      });
    });
  });
}

let finalQuizState = { idx: 0, answers: [], answered: false };

function renderFinalQuiz() {
  const box = document.getElementById('finalQuiz');
  if (!box) return;
  const i = finalQuizState.idx;
  if (i >= FINAL_QUIZ.length) {
    const correctCount = finalQuizState.answers.filter(a => a).length;
    const pct = Math.round(100 * correctCount / FINAL_QUIZ.length);
    const passed = pct >= 70;
    box.innerHTML = `<div class="results">
      <div class="score">${correctCount} / ${FINAL_QUIZ.length}</div>
      <div style="font-size:17px;margin:10px 0 18px;color:var(--text-soft)">${pct}% — ${passed?'Passed ✓':'Keep going'}</div>
      <p>${passed?('Solid grasp of ' + COURSE_TITLE.replace(/^Introduction to /,'') + '. Ready to put into practice.'):'Review the lessons where you missed questions — the material is dense, this is normal.'}</p>
      <button class="nav-btn primary" onclick="finalQuizState={idx:0,answers:[],answered:false};renderFinalQuiz()">Retake quiz</button>
    </div>`;
    return;
  }
  const Q = FINAL_QUIZ[i];
  let html = `<h4>Question ${i+1} of ${FINAL_QUIZ.length}</h4>`;
  html += `<div class="q-counter">${finalQuizState.answers.length} answered</div>`;
  html += `<div class="q-title">${Q.q}</div>`;
  html += `<div class="options">`;
  Q.options.forEach(opt => {
    html += `<button class="option" data-correct="${opt.correct}"><span class="icon">○</span><span>${opt.text}</span></button>`;
  });
  html += `</div><div class="feedback"></div>`;
  html += `<button class="next-btn" id="fqNext" disabled onclick="finalQuizNext()">${i === FINAL_QUIZ.length - 1 ? 'See results' : 'Next question →'}</button>`;
  box.innerHTML = html;
  box.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => {
      if (finalQuizState.answered) return;
      const correct = btn.getAttribute('data-correct') === 'true';
      box.querySelectorAll('.option').forEach(b => {
        b.disabled = true;
        if (b.getAttribute('data-correct') === 'true') b.classList.add('correct');
      });
      if (!correct) btn.classList.add('incorrect');
      const fb = box.querySelector('.feedback');
      fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
      fb.innerHTML = correct ? '<strong>Correct.</strong>' : '<strong>Not quite — the highlighted option is correct.</strong>';
      finalQuizState.answered = true;
      finalQuizState.answers.push(correct);
      document.getElementById('fqNext').disabled = false;
    });
  });
}

function finalQuizNext() {
  finalQuizState.idx++;
  finalQuizState.answered = false;
  renderFinalQuiz();
}

function goLesson(i) {
  if (i < 0 || i >= LESSONS.length) return;
  currentLesson = i;
  document.querySelectorAll('.lesson').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.lesson[data-lesson="${i}"]`);
  if (el) el.classList.add('active');
  document.querySelectorAll('.lesson-link').forEach(el => el.classList.remove('active'));
  const link = document.querySelector(`.lesson-link[data-i="${i}"]`);
  if (link) link.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function completeAndAdvance(i) {
  completed.add(i);
  document.querySelector(`.lesson-link[data-i="${i}"]`).classList.add('completed');
  updateProgress();
  if (i + 1 < LESSONS.length) goLesson(i + 1);
}

function finishCourse() {
  completed.add(LESSONS.length - 1);
  document.querySelector(`.lesson-link[data-i="${LESSONS.length-1}"]`).classList.add('completed');
  updateProgress();
  alert('🎓 Course complete. Now go put it to work.');
}

function updateProgress() {
  const total = LESSONS.length;
  const done = completed.size;
  const pct = Math.round(100 * done / total);
  document.getElementById('progressLabel').textContent = `${done} of ${total} lessons completed (${pct}%)`;
  document.getElementById('progressBar').style.width = pct + '%';
}

// Boot
document.title = COURSE_TITLE + ' — UpskillTech';
document.getElementById('courseTitleEl').textContent = COURSE_TITLE;
buildSidebar();
buildLessons();
updateProgress();
goLesson(0);
</script>
